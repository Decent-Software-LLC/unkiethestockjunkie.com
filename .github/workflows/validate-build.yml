name: Validate Build

# The content workflows (generate-content, fetch-fundamentals) commit directly to main
# and call requestPagesBuild without ever running Jekyll. A malformed article front
# matter, broken Liquid, or bad _config.yml therefore reaches GitHub Pages unverified -
# you find out from a 404 or a half-rendered site, not from CI.
#
# This job closes that gap: it builds on every push and pull request, fails loudly, and
# runs the same checks the content generator produces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pins the Ruby used for preview locally and in this job. System Ruby on macOS is
      # too old for modern rouge, which is why the repo carries a Dockerfile; reusing
      # that image here keeps "works locally" and "passes CI" the same statement.
      # _site is written into the workspace because test-articles-search.js inspects the
      # generated /articles page (it must assert against real output, not a copy of the logic).
      - name: Build site (strict)
        uses: docker://ruby:3.3-slim
        with:
          entrypoint: /bin/bash
          args: >
            -c "apt-get update -qq &&
                apt-get install -y -qq --no-install-recommends build-essential curl git ca-certificates >/dev/null &&
                gem install bundler --no-document >/dev/null &&
                bundle config set without 'development test' &&
                bundle install &&
                bundle exec jekyll build --strict_front_matter --trace"

      # Related-article linking is the one piece of generated structure most likely to
      # regress, and its failure mode is silent (links vanish, page still renders).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record what the build was made from
        # Suites that grade rendered HTML compare content hashes against this manifest instead of trusting that
        # _site is current. Without it they would either skip silently or audit output that predates the content.
        run: node scripts/mark-site-built.js

      - name: Run tests
        run: npm test

      # One place for these checks, not two. They were separate shell greps here until now:
      # the scaffolding grep duplicated test:bodies (which is strictly better - it distinguishes
      # front matter from body and shares its label list with the cleaner), and the related-article
      # count duplicated test:related. The original scaffolding grep only matched ^#{2,3} while the
      # corpus used bold headings, so it reported success while 95% of articles leaked instructions.
      # Duplicated guards don't just waste time, they rot differently from the thing they mirror.
      - name: Verify test coverage of generated structure
        run: |
          echo "Content and link guarantees run under 'npm test' (10 suites):"
          node -e "const t=require('./package.json').scripts.test; t.split('&&').forEach(s=>console.log('  '+s.trim()))"
