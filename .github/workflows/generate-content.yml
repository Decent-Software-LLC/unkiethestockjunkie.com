name: Generate Daily Content

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The generator gates its own output and exits non-zero when no candidate survives, deleting
      # rejected files so they cannot be committed. It tries up to 3 topics per run (GENERATE_ATTEMPTS);
      # a run that publishes nothing is a successful run of a correct pipeline, not a failure to publish.
      - name: Generate new article
        run: npm run generate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GENERATE_ATTEMPTS: '3'

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      # Independent re-check, deliberately NOT trusting the generator's own verdict. This exists because
      # publishing used to be unconditional: whatever the model returned was committed to main and a Pages
      # build was requested, with a `continue-on-error` heuristic as the only review. Two consecutive
      # unattended articles then reached a minors-facing site carrying fabricated dollar figures, leaked
      # front matter merged into prose, broken self-links and no risk framing. Validate Build does not
      # cover this, because Pages deploys regardless of whether that workflow passes.
      - name: Gate new articles (blocking)
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          files=$(git ls-files --others --exclude-standard -- _articles | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "no new article files; nothing to gate"
            exit 0
          fi
          echo "gating: $files"
          node scripts/check-candidate.js $files

      # Advisory only by design: percentages and headline figures get listed for a human, and the
      # blocking decision for dollar magnitudes lives in the gate above. A heuristic must not be able to
      # silently stop publication, or the first false positive trains everyone to delete the step.
      - name: List numeric claims needing human verification
        continue-on-error: true
        run: |
          newest=$(ls -t _articles/*.md | head -1)
          echo "reviewing $newest"
          node scripts/review-numbers.js "$newest"

      - name: Commit and push new article
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "📝 Auto-generated article: $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Trigger GitHub Pages rebuild
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            })
