name: Generate Daily Content

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Exit codes carry meaning: 0 published something, 2 means no candidate cleared the gate (an
      # expected outcome, not an outage -- surfaced as a warning), anything else is a crash worth waking
      # someone up for. Do not let either of those collapse into a plain `run:` failure or a silent pass.
      - name: Generate new article
        id: gen
        continue-on-error: true
        run: |
          set +e
          npm run generate
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          NVIDIA_API_KEY: *** secrets.NVIDIA_API_KEY }}
          GENERATE_ATTEMPTS: '3'

      - name: Note when nothing qualified
        if: steps.gen.outputs.exit_code == '2'
        run: echo "::warning::No generated candidate cleared the pre-publication gate today. Nothing was published -- read the generator log above for the rejection reasons."

      - name: Fail on generator crash
        if: steps.gen.outputs.exit_code != '0' && steps.gen.outputs.exit_code != '2'
        run: |
          echo "::error::Generator exited ${{ steps.gen.outputs.exit_code }} (not 0 or 2). That is a crash, not a rejected draft."
          exit 1

      # Publication is driven by the manifest the generator writes ONLY when a candidate passes its own
      # gate -- never by "did the working tree change". A `git status --porcelain` test plus `git add -A`
      # previously committed a 64KB orphan illustration whose article had died on a 503 (d1fde08), because
      # the API helper called process.exit(1) and skipped cleanup. Re-checking here instead of trusting the
      # generator's self-assessment keeps the two checks independent.
      - name: Gate and stage the published article
        id: publish
        run: |
          set -e
          if [ ! -f .generate-result.json ]; then
            echo "no publish manifest written; nothing qualified"
            git clean -fdq _articles assets/images || true
            exit 0
          fi
          file=$(node -p 'JSON.parse(require("fs").readFileSync(".generate-result.json","utf8")).file || ""')
          image=$(node -p 'JSON.parse(require("fs").readFileSync(".generate-result.json","utf8")).image || ""')
          if [ -z "$file" ] || [ ! -f "$file" ]; then
            echo "::error::publish manifest names a file that does not exist: '$file'"
            exit 1
          fi
          echo "gating $file"
          node scripts/check-candidate.js "$file"
          node scripts/verify-content.js "$file"
          git add "$file"
          if [ -n "$image" ]; then git add "$image"; fi
          # Whatever else is untracked under these paths is debris from a discarded attempt.
          git clean -fdq _articles assets/images || true
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "published_file=$file" >> "$GITHUB_OUTPUT"

      # Advisory by design: figures get listed for a human, while the blocking judgement for unsourced
      # dollar magnitudes lives in the gate. A heuristic must not be able to halt publication silently --
      # the first false positive trains everyone to delete the step.
      - name: List numeric claims needing human verification
        if: steps.publish.outputs.committed == 'true'
        continue-on-error: true
        run: node scripts/review-numbers.js "${{ steps.publish.outputs.published_file }}"

      - name: Commit and push new article
        if: steps.publish.outputs.committed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "📝 Auto-generated article: $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Trigger GitHub Pages rebuild
        if: steps.publish.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            })
