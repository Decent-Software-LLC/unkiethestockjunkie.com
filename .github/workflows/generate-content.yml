name: Generate Daily Content

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate new article
        run: npm run generate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      # Non-blocking human checkpoint. The prompt forbids invented figures and the first unattended
      # run still published "Tesla sold $5 billion in carbon credits," which matches no reported 2020
      # number. Prose rules don't constrain a model's numbers, so list every risky claim for review
      # in the job log instead of pretending an LLM graded itself. Intentionally does NOT fail the
      # step: publishing shouldn't hinge on a heuristic, and a failing gate here would be ignored
      # after the first false positive anyway.
      - name: List numeric claims needing human verification
        continue-on-error: true
        run: node scripts/review-numbers.js $(ls _articles/*.md | sort | tail -1)

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new article
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "📝 Auto-generated article: $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Trigger GitHub Pages rebuild
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            })
